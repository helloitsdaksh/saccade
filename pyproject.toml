[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saccade-ai"
version = "0.1.0"
description = "Intrinsic Attention Bottlenecks for Vision Transformers & LLM Prompt Compression."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Daksh Patel", email = "helloitsdaksh007@gmail.com" },
]
keywords = [
    "interpretability",
    "vision-transformer",
    "mechanistic-interpretability",
    "explainable-ai",
    "attention-bottleneck",
    "prompt-compression",
    "token-pruning",
    "llm",
    "pytorch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "matplotlib>=3.5.0",
    "scipy>=1.9.0",
    "timm>=0.9.0",
    "transformers>=4.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/helloitsdaksh/saccade"
Repository = "https://github.com/helloitsdaksh/saccade"
Documentation = "https://github.com/helloitsdaksh/saccade#readme"

[tool.hatch.build.targets.wheel]
packages = ["saccade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
